name: monitor
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  health:
    runs-on: self-hosted      # reads the heartbeat and Gold manifest on the always-on host
    steps:
      - name: Collector heartbeat and Gold readiness (a failure notifies the repo owner)
        env:
          HEARTBEAT_URL: file:///home/ubuntu/AIS-Data-Pipeline-Project/metrics/prod/heartbeat.json
          GOLD_URL: file:///home/ubuntu/AIS-Data-Pipeline-Project/data/prod/gold/_READY.json
        run: /home/ubuntu/spark-env/bin/python /home/ubuntu/AIS-Data-Pipeline-Project/scripts/check_heartbeat.py
